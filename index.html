<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>げんきでるボタン</title>

<style>

body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(#ffeef8, #dff7ff);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 25px;
  text-align: center;
  width: 80%;
  max-width: 350px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  position: relative;
  z-index: 2;
  transition: transform 0.3s;
}

.jump {
  animation: jump 0.6s;
}

@keyframes jump {
  0% { transform: scale(1); }
  30% { transform: scale(1.08) translateY(-10px); }
  60% { transform: scale(0.98); }
  100% { transform: scale(1); }
}

h1 {
  color: hotpink;
}

#message {
  font-size: 30px;
  font-weight: bold;
  margin: 30px 0;
  min-height: 90px;
  line-height: 1.5;
  color: #444;
  transition: all 0.3s;
}

.waiting {
  font-size: 20px !important;
  color: #aaa !important;
  font-weight: normal !important;
}

.specialText {
  font-size: 36px !important;
  color: #ff4fa3 !important;
  text-shadow:
    0 0 10px #fff,
    0 0 20px #ffb3d9,
    0 0 30px #ff69b4;
}

button {
  font-size: 20px;
  padding: 15px 25px;
  border: none;
  border-radius: 999px;
  background: pink;
  color: white;
}

button:active {
  transform: scale(0.95);
}

.sparkle {
  position: absolute;
  animation: fall 2.5s linear forwards;
  pointer-events: none;
}

@keyframes fall {

  0% {
    transform:
      translateY(-50px)
      rotate(0deg);
    opacity: 1;
  }

  100% {
    transform:
      translateY(120vh)
      rotate(360deg);
    opacity: 0;
  }
}

.rainbow {
  animation: rainbowFlash 0.5s infinite;
}

@keyframes rainbowFlash {
  0% { background: #ffeef8; }
  20% { background: #fff0a8; }
  40% { background: #c8ffd9; }
  60% { background: #cde7ff; }
  80% { background: #f3d0ff; }
  100% { background: #ffeef8; }
}

</style>
</head>

<body>

<div class="card" id="card">

  <h1>🌈げんきでるボタン✨</h1>

  <div id="message">
    ボタンをおしてね！
  </div>

  <button onclick="showMessage()">
    おしてみる！
  </button>

</div>

<script>

const messages = [
  "きょうも えらい！",
  "だいじょうぶ！",
  "にこにこ すてき！",
  "がんばってるね！",
  "きみは すごい！",
  "いっぱい わらおう！",
  "たのしく いこう！"
  "はなまるまんてん！"
  "いいひに　なりそう！"
  "おようふく　にあってる！"
  "いつでも　おうえん　してるよ！"
];

const specialMessages = [
  "✨きみは たからもの！✨",
  "🌈スーパーげんきパワー！🌈",
  "✨きょうのラッキーキッズ！✨",
  "💖えがお100てん！💖"
];

let count = 0;
let busy = false;

function animalSound() {

  const sounds = [
    "わん！🐶",
    "にゃー！🐱",
    "ぴよぴよ！🐥",
    "も〜！🐮"
    "ぱお～ん！🐘"
    "うっき〜！🐵"
  ];

  return sounds[
    Math.floor(Math.random() * sounds.length)
  ];
}

function showMessage() {

  if (busy) return;

  busy = true;

  count++;

  const message = document.getElementById("message");
  const card = document.getElementById("card");

  message.classList.remove("specialText");

  message.classList.add("waiting");
  message.innerText = "どきどき…";

  setTimeout(() => {

    message.classList.remove("waiting");

    if (count % 10 === 0) {

      const special =
        specialMessages[
          Math.floor(Math.random() * specialMessages.length)
        ];

      message.innerText =
        animalSound() + "\n" + special;

      message.classList.add("specialText");

      startRainbow();
      sparkleBurst(60);

      card.classList.add("jump");

      setTimeout(() => {
        card.classList.remove("jump");
      }, 600);

    } else {

      const random =
        messages[
          Math.floor(Math.random() * messages.length)
        ];

      message.innerText =
        animalSound() + "\n" + random;
    }

    busy = false;

  }, 1200);
}

function sparkleBurst(amount) {

  const icons = [
    "✨","🌟","💖","⭐","🎀","🦄","🌈"
  ];

  for (let i = 0; i < amount; i++) {

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.innerText =
      icons[Math.floor(Math.random() * icons.length)];

    sparkle.style.left =
      Math.random() * 100 + "vw";

    sparkle.style.top = "-50px";

    sparkle.style.fontSize =
      (20 + Math.random() * 40) + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => {
      sparkle.remove();
    }, 2500);
  }
}

function startRainbow() {

  document.body.classList.add("rainbow");

  setTimeout(() => {
    document.body.classList.remove("rainbow");
  }, 5000);
}

</script>

</body>
</html>
